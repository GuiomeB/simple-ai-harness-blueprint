name: Tests

# Blocking gate: runs the stdlib unittest suite under tests/.
# Today it covers the rail guard (scripts/check_pr_rail_consistency.py) and
# asserts the template copies of that script stay byte-identical to the root
# copy. No path filter on purpose: a required check must report on every PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
